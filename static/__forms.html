<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Reçu</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Déclaration du formulaire « contact » pour Netlify Forms. La page /contact envoie ses données ici.
         Garder exactement les mêmes noms de champs que sur /contact. -->
</head>
<body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input name="bot-field" />
        <input name="entreprise" />
        <input name="email" />
        <input name="telephone" />
        <input name="service" />
        <input name="budget" />
        <textarea name="besoin"></textarea>
        <input name="reunion_date" />
        <input name="reunion_creneau" />
    </form>
    <h1>Merci !</h1>
    <p>Votre demande a été envoyée avec succès.</p>
</body>
</html>
