[build]
  command = "npm run build"
  publish = "build"
  # Chaque mise en production coûte des crédits Netlify : on saute le build si le commit
  # ne touche aucun fichier qui change le site (ex. README, notes, fichiers d'outils).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src static content netlify package.json package-lock.json svelte.config.js 'vite.config.*' netlify.toml"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Anciennes adresses d'articles (signalées en 404 par la Search Console) → articles actuels
[[redirects]]
  from = "/blog/agence-growth-hacking-paris-acc-l-rez-votre-croissance-en-2026"
  to = "/blog/agence-growth-hacking-paris-accelerez-votre-croissance-en-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ia-pour-pme"
  to = "/blog/intelligence-artificielle-pour-les-pme-ce-qui-est-possible-en-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/d-veloppeur-web-freelance-paris-freelance-ou-agence-que-choisir-en-2026"
  to = "/blog/developpeur-web-freelance-paris-freelance-ou-agence-que-choisir-en-2026"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Les adresses techniques Netlify renvoient vers le vrai domaine (évite le contenu dupliqué dans Google,
# maintenant que les pages sont statiques et ne passent plus par le serveur qui ajoutait « noindex »).
[[redirects]]
  from = "https://darling-dasik-bbfae6.netlify.app/*"
  to = "https://norbertdigitalservice.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--darling-dasik-bbfae6.netlify.app/*"
  to = "https://norbertdigitalservice.fr/:splat"
  status = 301
  force = true
