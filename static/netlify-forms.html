<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <!-- Formulaire statique pour la détection Netlify Forms -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="entreprise" />
      <input name="email" />
      <input name="telephone" />
      <input name="service" />
      <input name="budget" />
      <textarea name="besoin"></textarea>
      <input name="reunion_date" />
      <input name="reunion_creneau" />
    </form>
  </body>
</html>
