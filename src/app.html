%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Google Tag Manager — chargé après le rendu initial pour ne pas bloquer FCP/LCP -->
		<script>
			function loadGTM(){var w=window,d=document,s='script',l='dataLayer',i='GTM-5QGRJJZJ';w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);}
			if('requestIdleCallback' in window){requestIdleCallback(loadGTM)}else{setTimeout(loadGTM,2500)}
		</script>
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5QGRJJZJ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<div style="display: contents">%sveltekit.body%</div>

	</body>
