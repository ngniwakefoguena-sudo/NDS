[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Les adresses techniques Netlify renvoient vers le vrai domaine (évite le contenu dupliqué dans Google,
# maintenant que les pages sont statiques et ne passent plus par le serveur qui ajoutait « noindex »).
[[redirects]]
  from = "https://darling-dasik-bbfae6.netlify.app/*"
  to = "https://norbertdigitalservice.fr/:splat"
  status = 301
  force = true

